      <script type="text/javascript">
       function getTextbook(course_code, sec) {
  //https://www.bkstr.com/claremontstore/course-materials-results?shopBy=course&divisionDisplayName=CLAREMONT%20MCKENNA%20COLLEGE
  //&departmentDisplayName=GOVT&courseDisplayName=020&sectionDisplayName=01&programId=1550&termId=100078104

  var div = convertDiv((course_code.substring(9, 11)).trim());
  var dept = (course_code.substring(0, 4)).trim();
  var course = (course_code.substring(4, 9)).trim();

  var url = "https://www.bkstr.com/claremontstore/course-materials-results?shopBy=course&divisionDisplayName=" +div+ "&departmentDisplayName=" +dept+ "&courseDisplayName=" +course+ "&sectionDisplayName=" +sec+ "&programId=1550&termId=100086428";
  var win = window.open(url, '_blank');
  win.focus();
}

function convertDiv(div) { //for new change
   if (div =='CM') {
      return "CLAREMONT%20MCKENNA%20COLLEGE";

   }else if (div =='HM') {
      return "HARVEY%20MUDD%20COLLEGE";

   }else if (div =='PZ') {
      return "PITZER%20COLLEGE";

   }else if (div =='PO') {
      return "POMONA%20COLLEGE";

   }else if (div =='SC') {
      return "SCRIPPS%20COLLEGE";

   }else {
      return div;
   }
}

function getTextbook2(course_code, sec) {
  //BIOL002A PO-01
  //         https://www.bkstr.com/webApp/discoverView?bookstore_id-1=994&term_id-1=SP2021&div-1=AF&dept-1=AFRI&course-1=010AC&section-1=01
  var div = (course_code.substring(9, 11)).trim();
  var dept = (course_code.substring(0, 4)).trim();
  var course = (course_code.substring(4, 9)).trim();

  var url = "https://www.bkstr.com/webApp/discoverView?bookstore_id-1=994&term_id-1=FA2025&div-1=" +div+ "&dept-1=" +dept+ "&course-1=" +course+ "&section-1=" +sec;

  var win = window.open(url, '_blank');
  win.focus();
}

function popUp(mylink, windowname, width, height) {
   if (! window.focus) return true;
   var href;
   if (typeof(mylink) == 'string')
      href=mylink;
   else
      href=mylink.href;

   var left = (screen.width/2)-(width/2);
   var top = (screen.height/2)-(height/2);
                                            //directories=no,titlebar=no,toolbar=no,location=no,status=no,menubar=no
   var popup_window = window.open(href, windowname, "width=" +width+ ",height=" +height+ ",scrollbars=no, toolbar=no, menubar=no, resizable=yes, top=" +top+ ", left=" +left);
   try {
      popup_window.focus();   
   }catch (e) {
      alert("Pop-up Blocker is enabled! Please add this site to your exception list.");
   }
  
   return false;
}
